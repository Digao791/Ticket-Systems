spring.application.name=tickets

#PostgreSWL
#spring.datasource.url=jdbc:postgresql://localhost:5432/tickets_db
#spring.datasource.username=tickets_app
#spring.datasource.password=tickets_dev_password

#PostgreSWL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/tickets_db}

spring.datasource.username=${DB_USERNAME:tickets_app}

spring.datasource.password=${DB_PASSWORD:tickets_dev_password}


# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration


# Não derruba a aplicação se o DB estiver offline no startup
spring.datasource.hikari.initialization-fail-timeout=-1

# Não esperar 30 segundos quando alguma operação pedir conexão
spring.datasource.hikari.connection-timeout=2000

# Evita obrigar conexões ociosas enquanto o DB está fora
spring.datasource.hikari.minimum-idle=0

# Impede Hibernate de consultar metadata JDBC durante bootstrap
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect