<!DOCTYPE html>
<html
    lang="pt-BR"
    xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login - Ticket System</title>

    <link
        rel="stylesheet"
        th:href="@{/css/login.css}">

</head>

<body>

<main class="login-page">

    <section class="login-card">

        <div class="login-header">

            <p class="system-name">
                Ticket System
            </p>

            <h1>Entrar</h1>

            <p>
                Informe suas credenciais para acessar
                o sistema.
            </p>

        </div>


        <div
            class="alert alert-error"
            th:if="${param.error}">

            Email ou senha inválidos.

        </div>


        <div
            class="alert alert-success"
            th:if="${param.logout}">

            Você saiu do sistema.

        </div>


        <form
            class="login-form"
            th:action="@{/login}"
            method="post">

            <div class="form-field">

                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    placeholder="usuario@email.com"
                    autocomplete="username"
                    required>

            </div>


            <div class="form-field">

                <label for="password">
                    Senha
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    placeholder="Sua senha"
                    autocomplete="current-password"
                    required>

            </div>


            <button
                class="login-button"
                type="submit">

                Entrar

            </button>

        </form>

    </section>

</main>

</body>
</html>
