<!DOCTYPE html>
<html
    lang="pt-BR"
    xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ticket não encontrado | Ticket System</title>

    <link
        rel="stylesheet"
        th:href="@{/css/tickets.css}">
</head>

<body>

<main class="form-page-container">

    <section class="ticket-form-panel error-panel">

        <div class="error-code">
            404
        </div>

        <h1>Ticket não encontrado</h1>

        <p class="error-message"
           th:text="${message}">
            O ticket solicitado não existe ou não está disponível.
        </p>

        <div class="error-actions">

            <a
                class="new-ticket-button"
                th:href="@{/}">
                Voltar para projetos
            </a>

        </div>

    </section>

</main>

</body>
</html>
