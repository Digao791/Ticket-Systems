
name: AI Test Generator

on:
  push:
    branches: [main]
    paths:
      - 'src/main/java/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Find changed Java files
        id: changes
        shell: bash
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --name-only HEAD^ HEAD \
              -- 'src/main/java/**/*.java' \
                 'src/main/java/*.java' \
              > changed-files.txt
          else
            find src/main/java -name '*.java' \
              > changed-files.txt
          fi

          cat changed-files.txt

          if [ -s changed-files.txt ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Copilot CLI
        if: steps.changes.outputs.found == 'true'
        run: npm install -g @github/copilot

      - name: Generate tests
        if: steps.changes.outputs.found == 'true'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: |
          copilot \
            --agent=test-generator \
            --prompt "Read changed-files.txt and generate tests following the test-generation skill. Only create Java test files under src/test/java." \
            --allow-tool=read \
            --allow-tool=write \
            --no-ask-user

      - name: Validate generated files
        if: steps.changes.outputs.found == 'true'
        shell: bash
        run: |
          git add -N src/test/java
          git diff --name-only > modified-files.txt

          if grep -vE '^src/test/java/.*\.java$' modified-files.txt; then
            echo "Unauthorized file changes detected"
            exit 1
          fi

      - name: Run tests
        if: steps.changes.outputs.found == 'true'
        run: |
          chmod +x mvnw
          ./mvnw test

      - name: Create Pull Request
        if: steps.changes.outputs.found == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/generated-tests
          delete-branch: true
          commit-message: "test: generate automated tests"
          title: "test: AI-generated tests"
          body: |
            Automated tests generated by GitHub Copilot.

            - Review generated assertions.
            - Verify expected behavior.
            - Confirm Maven tests pass.
          add-paths: |
            src/test/java/**/*.java
